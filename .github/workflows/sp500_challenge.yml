name: sp500-challenge

on:
  workflow_dispatch:

concurrency:
  group: sp500-challenge
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install yfinance pandas numpy

      - name: Run S&P 500 challenge
        shell: bash
        run: python sp500_challenge.py | tee sp500_challenge_results.txt

      - name: Save results to the repo
        if: always()
        run: |
          rm -rf __pycache__
          git config user.name "momentum-bot"
          git config user.email "momentum-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "S&P 500 challenge results" && git push)
